<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ComicCraft - AI Comic Creator</title>
<style>
body {
font-family: Arial, sans-serif;
background: #f0f2f5
url('[https://images.unsplash.com/photo-1511497584788-8767611136f0](ht
tps://images.unsplash.com/photo-1511497584788-8767611136f0)')
no-repeat center center fixed;
background-size: cover;
margin: 0;
padding: 40px 0;
}
.container {
max-width: 600px;
margin: auto;
background: rgba(255, 255, 255, 0.95);
padding: 30px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
h2 { text-align: center; color: #1a73e8; }
.form-group { margin-bottom: 15px; }
label { font-weight: bold; display: block; margin-bottom: 5px;
}
input, select, textarea {
width: 100%;
padding: 10px;
border-radius: 6px;
border: 1px solid #ccc;
box-sizing: border-box;
}
button {
width: 100%;
padding: 12px;
background: #1a73e8;
color: white;
border: none;
border-radius: 6px;
font-size: 16px;
cursor: pointer;
font-weight: bold;
}
button:hover { background: #1557b0; }
</style>
</head>
<body>
<div class="container">
<h2>✏️ Create Your Comic</h2>
<form action="/generate" method="post">
<div class="form-group">
<label>Story Prompt:</label>
<textarea name="prompt" rows="3" required
placeholder="A brave fox explores an enchanted forest."></textarea>
</div>
<div class="form-group">
<label>Main Character Name:</label>
<input type="text" name="character_name" required
placeholder="Free">
</div>
<div class="form-group">
<label>Setting:</label>
<select name="setting">
<option value="Forest">Forest</option>
<option value="Space">Space</option>
<option value="City">City</option>
<option value="School">School</option>
</select>
</div>
<div class="form-group">
<label>Story Tone:</label>
<select name="tone">
<option value="Dramatic">Dramatic</option>
<option value="Funny">Funny</option>
<option
value="Light-hearted">Light-hearted</option>
<option value="Poetic">Poetic</option>
</select>
</div>
<div class="form-group">
<label>Art Style:</label>
<select name="style">
<option value="Realistic">Realistic</option>
<option value="Anime">Anime</option>
<option value="Comic Book">Comic Book</option>
<option value="Pixel Art">Pixel Art</option>
</select>
</div>
<button type="submit">Generate Comic</button>
</form>
</div>
</body>
</html>
